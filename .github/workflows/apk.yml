name: Build and Release APK

env:
  main_project_module: app
  # ========== 修改区域 START ==========
  # 改成你的 Xposed 官方仓库地址
  target_owner: Xposed-Modules-Repo
  target_repo: io.github.Rillwyn.maceditor   # 改成你的包名（即仓库名）
  # ========== 修改区域 END ==========

on:
  push:
    branches:
      - "release/**"                # 推送 release/* 分支时触发
    tags:
      - "v*.*.*"                    # 推送 v1.0.0 格式的标签时触发
  workflow_dispatch:                # 允许手动触发
    inputs:
      version:
        description: "版本号 (例如: 1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置版本号
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_ENV
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_ENV
          fi
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: 配置签名（从 Secrets 读取）
        run: |
          echo ${{ secrets.STORE }} | base64 -d > upload.jks
          echo ${{ secrets.LOCAL }} | base64 -d > local.properties
          chmod +x ./gradlew

      - name: 编译 Release APK 和 AAB
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          rm upload.jks local.properties

      # ========== 发布到你的 GitHub Releases（你的个人仓库） ==========
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk
            ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab

      # ========== 发布到 Xposed 官方仓库 ==========
      - name: 发布到 Xposed 官方仓库
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}           # 需要你创建 Personal Access Token
          repository: ${{ env.target_owner }}/${{ env.target_repo }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk

      # ========== 同步 README 到 Xposed 官方仓库 ==========
      - name: 同步 README 到 Xposed 官方仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.target_owner }}/${{ env.target_repo }}
          path: target_repo
          token: ${{ secrets.PAT }}

      - name: 同步文件
        run: |
          cd target_repo
          cp ../README.md ../README_CN.md ../CHANGELOG.md ../CHANGELOG_CN.md . 2>/dev/null || true
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md README_CN.md CHANGELOG.md CHANGELOG_CN.md 2>/dev/null || true
          git commit --amend --no-edit 2>/dev/null || git commit -m "Sync README from source repo"
          git push --force